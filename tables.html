<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border: 1px solid black;
            width: 65%;
            margin: auto;
            border-collapse: collapse;
        }

        th {
            color: brown;
            border: 1px solid black;
            padding: 12px 8px;
            text-align: left;
        }

        td {
            border: 1px solid black;
            padding: 12px 8px;
        }

        /* CSS Framework bootstrap */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td>
                <td>60000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>Mombasa</td>
                <td>25</td>
                <td>80000</td>
            </tr>
            <tr>
                <td>Mary</td>
                <td>Wanjiku</td>
                <td>Kisumu</td>
                <td>30</td>
                <td>100000</td>
            </tr>
            <tr>
                <td>Peter</td>
                <td>Smith</td>
                <td>Nakuru</td>
                <td>28</td>
                <td>90000</td>


        </tbody>

    </table>

    <!-- List Unordered -->
    <ul>
        <li>Nairobi</li>
        <li>Mombasa</li>
        <li>Kisumu</li>
        <li>Nakuru</li>
        <li>Eldoret</li>
    </ul>



</body>


</html>
