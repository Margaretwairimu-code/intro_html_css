<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: 'Fira Sans', sans-serif;
        }

        nav {
            display: flex;
            justify-content: center;
            /* background:#000; */
            border-bottom: 1px solid #c1c1c1;
        }

        .nav-items {
            width: 80%;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-items ul {
            display: flex;
            list-style: none;
        }

        .nav-items li {
            margin-right: 20px;
        }

        .nav-items a {
            text-decoration: none;
            color: black;
            text-transform: capitalize;
        }

        .nav-items a:hover {
            color: rgb(168, 71, 71);
            text-decoration: underline;
        }

        .nav-items img {
            width: 48px;
            height: 48px;
        }

        /* git add. */
        /* git commit -m "Built the navigation bar" */
        /* git push */
    </style>
</head>

<body>

    <!-- semantic tags -->
    <nav>
        <div class="nav-items">
            <img src="images/paper-plane_11473231.png"
                alt="White paper airplane with a looping dotted trail on a magenta-to-purple circular background, giving the logo a playful feel. No text.">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Blog</a></li>

            </ul>
        </div>
    </nav>

</body>

</html>
